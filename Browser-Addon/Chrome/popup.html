<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  body{width:230px;margin:0;background:#14181D;color:#E7EAED;
    font-family:system-ui,sans-serif;padding:18px;text-align:center}
  img.logo{width:44px;height:44px;display:block;margin:0 auto 10px}
  .logo-txt{font-weight:800;font-size:18px;margin-bottom:4px}
  .logo-txt span{color:#F5A623}
  p{color:#8B929B;font-size:12px;margin:0 0 16px}
  button{width:100%;background:#F5A623;border:0;color:#161A1F;font-weight:800;
    font-size:14px;padding:11px;border-radius:9px;cursor:pointer}
  button:hover{filter:brightness(1.06)}
</style>
</head>
<body>
  <img class="logo" src="icons/icon-96.png" alt="TextTrace">
  <div class="logo-txt">Text<span>Trace</span></div>
  <p>Search text or use regex in local files</p>
  <button id="open">Open TextTrace</button>
  <script src="popup.js"></script>
</body>
</html>
